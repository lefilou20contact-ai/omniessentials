# ======================================================================
#  STYLE ET PNJ DU SPAWN
#  Utilisé par la commande : /monserveur buildspawn confirm
#  Le spawn est construit autour de TOI (tu es le centre de la place).
#  Chaque matériau peut être un nom simple (stone_bricks) ou un état complet
#  (minecraft:quartz_slab[type=bottom]). Liste : https://minecraft.wiki/w/Java_Edition_data_values
# ======================================================================

radius: 20             # rayon de la place (16 à 28)
clear-height: 16       # hauteur nettoyée au-dessus de la place (arbres, collines...)
trees: true            # plante 4 cerisiers
pavilion-offset: 8     # distance des 4 pavillons par rapport au centre

# Texte flottant au-dessus de la fontaine ({server-name} vient de links.yml)
hologram-title: "<gold><bold>{server-name}<newline><gray>Bienvenue !"

palette:
  center: "smooth_quartz"                 # autour de la fontaine
  inner: "stone_bricks"
  checker-a: "polished_andesite"          # damier de la place
  checker-b: "smooth_stone"
  outer: "polished_diorite"               # couronne extérieure
  path: "smooth_sandstone"                # les 4 chemins
  rim: "polished_blackstone_bricks"       # bordure
  curb: "minecraft:polished_blackstone_brick_slab[type=bottom]"
  foundation: "stone_bricks"              # remplissage sous la place
  fountain-wall: "quartz_bricks"
  fountain-slab: "minecraft:quartz_slab[type=bottom]"
  fountain-water: "water"
  fountain-pillar: "quartz_pillar"
  light: "sea_lantern"
  pavilion-floor: "polished_deepslate"
  post: "minecraft:stripped_dark_oak_log[axis=y]"
  roof: "dark_oak_planks"
  roof-slab: "minecraft:dark_oak_slab[type=bottom]"
  gate-pillar: "stone_bricks"
  gate-top: "chiseled_stone_bricks"
  lamp-post: "stone_brick_wall"
  grass: "grass_block"

# ----------------------------------------------------------------------
#  PNJ créés avec le spawn
#  dx / dz : position par rapport au centre (dx + = est, dz + = sud)
#  yaw     : direction du regard (optionnel : sinon il regarde le centre)
#  profession : armorer butcher cartographer cleric farmer fisherman fletcher
#               leatherworker librarian mason nitwit none shepherd toolsmith weaponsmith
#  action  : MENU (main, shop, homes, quests, tags) | COMMAND (sans /) | LINK (nom d'une variable de links.yml)
# ----------------------------------------------------------------------
npcs:
  guide:
    dx: 0
    dz: 6
    yaw: 0
    name: "<gold><bold>Guide"
    subtitle: "<gray>Clic droit : menu"
    profession: cleric
    action: MENU
    value: main
  boutique:
    dx: 8
    dz: 8
    name: "<green><bold>Boutique"
    subtitle: "<gray>Achète et vends"
    profession: toolsmith
    action: MENU
    value: shop
  quetes:
    dx: -8
    dz: 8
    name: "<gold><bold>Quêtes"
    subtitle: "<gray>Missions du jour"
    profession: librarian
    action: MENU
    value: quests
  tags:
    dx: 8
    dz: -8
    name: "<aqua><bold>Tags"
    subtitle: "<gray>Personnalise ton pseudo"
    profession: shepherd
    action: MENU
    value: tags
  homes:
    dx: -8
    dz: -8
    name: "<red><bold>Homes"
    subtitle: "<gray>Tes maisons"
    profession: mason
    action: MENU
    value: homes
  discord:
    dx: 5
    dz: 13
    name: "<blue><bold>Discord"
    subtitle: "<gray>Clic droit : lien"
    profession: fisherman
    action: LINK
    value: discord
  youtube:
    dx: -5
    dz: 13
    name: "<red><bold>YouTube"
    subtitle: "<gray>Clic droit : lien"
    profession: butcher
    action: LINK
    value: youtube
