name: MonServeur
version: 1.0.0
main: dev.monserveur.MonServeurPlugin
api-version: '1.21'
description: Plugin tout-en-un (grades, tags, économie, boutique, menus, niveaux, quêtes, homes, lobby)
authors: [MonServeur]

commands:
  menu:
    description: Ouvre le menu principal
    aliases: [m]
  shop:
    description: Ouvre la boutique
    aliases: [boutique]
  balance:
    description: Affiche ton solde
    aliases: [bal, money, argent]
    usage: /balance [joueur]
  pay:
    description: Envoie de l'argent à un joueur
    usage: /pay <joueur> <montant>
  baltop:
    description: Classement des plus riches
  eco:
    description: Gestion de l'économie (admin)
    usage: /eco <give|take|set> <joueur> <montant>
  sethome:
    description: Définit un home
    usage: /sethome [nom]
  home:
    description: Téléportation à un home
    usage: /home [nom]
  delhome:
    description: Supprime un home
    usage: /delhome <nom>
  homes:
    description: Ouvre le menu des homes
  spawn:
    description: Téléportation au spawn
  setspawn:
    description: Définit le spawn (admin)
  level:
    description: Affiche ton niveau
    aliases: [lvl, niveau, stats]
  quests:
    description: Ouvre les quêtes du jour
    aliases: [quetes, quête, quêtes]
  tag:
    description: Ouvre le menu des tags
    aliases: [tags]
  rank:
    description: Gestion des grades (admin)
    aliases: [grade]
    usage: /rank <list|set> ...
  npc:
    description: Gestion des PNJ et hologrammes (admin)
    usage: /npc <create|name|subtitle|action|profession|move|remove|list|hologram>
  tpa:
    description: Demande de téléportation vers un joueur
    usage: /tpa <joueur>
  tpahere:
    description: Demande à un joueur de te rejoindre
    usage: /tpahere <joueur>
  tpaccept:
    description: Accepte la demande de téléportation en attente
  tpdeny:
    description: Refuse la demande de téléportation en attente
  tpacancel:
    description: Annule ta demande de téléportation envoyée
  back:
    description: Retourne à ta position précédente
  sell:
    description: Vend rapidement des objets
    usage: /sell <hand|all>
  ah:
    aliases: [auction, hoteldesventes]
    description: Hôtel des ventes entre joueurs
    usage: /ah [my|collect|sell <prix>]
  monserveur:
    description: Commandes d'administration du plugin
    usage: /monserveur <reload|buildspawn>

permissions:
  monserveur.admin:
    description: Accès aux commandes d'administration
    default: op
  monserveur.teleport.bypass:
    description: Pas de délai de téléportation
    default: op
  monserveur.lobby.bypass:
    description: Ignore les protections du mode lobby
    default: op
