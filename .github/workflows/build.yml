# Compile le plugin automatiquement sur GitHub (aucune installation sur ton PC).
# Onglet "Actions" > dernier run > "Artifacts" > MonServeur.jar
name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: MonServeur.jar
          path: target/MonServeur-*.jar
